<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t"><title id="t">tsbench architecture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" fill="#1f2937"/></marker></defs>
<rect width="1200" height="900" fill="#fbfaf7"/>
<text x="70" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="48" font-weight="700" fill="#1f2937">tsbench</text>
<text x="70" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" fill="#57534e">Anomaly-detection benchmark that stress-tests the metrics</text>
<rect x="70" y="198" width="64" height="4" fill="#78350f"/>
<rect x="70" y="330" width="146" height="220" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.25"/>
<text x="143" y="394" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Datasets</text>
<text x="143" y="424" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">NAB and UCR,</text>
<text x="143" y="447" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">public data only</text>
<rect x="262" y="330" width="146" height="220" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.25"/>
<text x="335" y="394" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Loader</text>
<text x="335" y="424" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">series and labels,</text>
<text x="335" y="447" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">training prefix split</text>
<rect x="454" y="330" width="292" height="220" rx="6" fill="#f1eae7" stroke="#78350f" stroke-width="2.5"/>
<text x="600" y="394" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Detectors</text>
<text x="600" y="424" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">z-score, STL residual,</text>
<text x="600" y="447" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">Isolation Forest, LOF,</text>
<text x="600" y="470" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">ARIMA, matrix profile,</text>
<text x="600" y="493" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">autoencoder, plus random</text>
<text x="600" y="516" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">and flag-all baselines</text>
<rect x="792" y="330" width="146" height="220" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.25"/>
<text x="865" y="394" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Metrics</text>
<text x="865" y="424" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">point-wise,</text>
<text x="865" y="447" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">point-adjusted,</text>
<text x="865" y="470" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">event-based,</text>
<text x="865" y="493" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">AUC and delay</text>
<rect x="984" y="330" width="146" height="220" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.25"/>
<text x="1057" y="394" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Report</text>
<text x="1057" y="424" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">tables and figures</text>
<text x="1057" y="447" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">from one command</text>
<path d="M216 440 H260" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M408 440 H452" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M746 440 H790" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M938 440 H982" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="70" y="620" width="1060" height="92" rx="6" fill="#f3f1ec" stroke="#a8a29e" stroke-width="1.25"/>
<rect x="70" y="620" width="5" height="92" fill="#78350f"/>
<text x="100" y="656" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1f2937">Threshold rule</text>
<text x="100" y="687" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" fill="#57534e">Set from the training prefix only, never from test labels.</text>
<rect x="70" y="734" width="1060" height="92" rx="6" fill="#f3f1ec" stroke="#a8a29e" stroke-width="1.25" stroke-dasharray="6 5"/>
<rect x="70" y="734" width="5" height="92" fill="#78350f"/>
<text x="100" y="770" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1f2937">Evaluation (planned)</text>
<text x="100" y="801" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" fill="#57534e">5 seeds, mean rank with bootstrap CIs, Wilcoxon tests, rank change per metric.</text>
<text x="70" y="860" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#78716c">github.com/synamalhan/tsbench</text></svg>